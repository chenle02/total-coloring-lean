- id: total-coloring-lean/exists-valid-assignment-of-highdegree
  decl: TotalColoring.exists_valid_assignment_of_highDegree
  kind: theorem
  summary: "Every finite graph G with Fintype.card V <= 2 * G.maxDegree has a valid total assignment with palette ExtensionPalette (G.maxDegree + 1), i.e. G.maxDegree + 3 colors, covering empty and nonempty vertex types with no parity hypothesis."
  aliases: []
  keywords: [graph-theory, total-coloring]
  file: TotalColoring/HighDegreeTotalColoring.lean
  status: reusable
  superseded_by: null
  citation: null
  depends_on: []
