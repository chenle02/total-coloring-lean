name = "TotalColoring"
version = "0.1.0"
defaultTargets = ["TotalColoring"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
description = "Lean 4 formalization and certificate checking for total coloring and auxiliary rainbow edge-coloring reductions"
keywords = ["graph-theory", "total-coloring", "edge-coloring", "combinatorics", "formal-verification"]
homepage = "https://github.com/chenle02/total-coloring-lean"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "TotalColoring"
