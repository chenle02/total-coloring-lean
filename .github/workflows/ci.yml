name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs 29792338441 and 29795877319 showed that the complete gate needs
    # bounded parallelism and a longer envelope on a hosted runner.  The
    # literal full-umbrella `lake env leanchecker` is a separately recorded
    # large-memory gate; excluding it here is a runner constraint, not a
    # theorem claim.
    timeout-minutes: 300
    env:
      LAKE_JOBS: "1"
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject proof placeholders and native-evaluation axioms
        shell: bash
        run: bash scripts/check-placeholders.sh

      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          build: true
          mk_all-check: false
          use-mathlib-cache: true
          leanchecker: false

      - name: Ensure all files are imported
        # The Audit library has no umbrella module: each Challenge and its
        # Solution declare the same name and cannot be imported together.
        run: lake exe mk_all --check --lib TotalColoring

      - name: Build the comparator audit
        run: lake build Audit

      - name: Check minimum-six proof objects sequentially
        shell: bash
        run: |
          lake env leanchecker TotalColoring.MinSixCageModel
          lake env leanchecker TotalColoring.MinSixCountLemmas
          lake env leanchecker TotalColoring.MinSixGuardSoundness

      - name: Check public documentation snippet
        run: lake env lean docs/examples/Quickstart.lean
